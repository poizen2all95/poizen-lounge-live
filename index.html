<!doctype html>
<html lang="en" data-vibe="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poizen Lounge</title>
<meta name="description" content="PoiZen's live picks board — every leg graded live.">
<meta name="theme-color" content="#04070A">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="crest-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Poizen Lounge — a night-time sportsbook lounge.
   Layout: centered shell (max 1480). Rail attached left on desktop, tab bar on phones.
   Identity: gold-rimmed crest, venom teal, brand gold. Win = green, loss = red, live = gold pulse. */
:root{
  --bg:#04070A; --bg-glow1:rgba(20,241,199,.17); --bg-glow2:rgba(242,193,78,.10); --bg-glow3:rgba(76,201,240,.10);
  --ink:#0B1016; --panel:#0F151D; --panel2:#151D27; --panel3:#1B2532;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --fg:#F4F7FA; --fg2:#9FB0C0; --fg3:#647585;
  --teal:#14F1C7; --teal2:#0FB89A; --teal-d:#0A3F3A; --gold:#F2C14E; --gold2:#FFDF8A; --gold-d:#8A6414;
  --win:#2EE59D; --loss:#FF3B5C; --live:#FFC53D; --sky:#4CC9F0; --violet:#9B7BFF;
  --on-teal:#02130F; --on-gold:#1C1302;
  --card-grad:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  --hero:linear-gradient(120deg,rgba(20,241,199,.22) 0%,rgba(76,201,240,.12) 45%,rgba(242,193,78,.14) 100%);
  --chat-bg:rgba(4,6,8,.58);
  --stadium:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --jersey:'Teko','Barlow Condensed',sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:20px; --shadow:0 24px 50px -22px rgba(0,0,0,.9);
  color-scheme:dark;
}
[data-vibe="vegas"]{
  --bg:#0A0705; --bg-glow1:rgba(242,193,78,.18); --bg-glow2:rgba(224,40,74,.14); --bg-glow3:rgba(20,241,199,.06);
  --ink:#120D08; --panel:#17110B; --panel2:#1F170F; --panel3:#291E13;
  --line:rgba(242,193,78,.13); --line2:rgba(242,193,78,.28);
  --fg:#FBF6EC; --fg2:#C4B49B; --fg3:#857561;
  --teal:#F2C14E; --teal2:#D9A531; --teal-d:#4A3209; --on-teal:#1C1302;
  --hero:linear-gradient(120deg,rgba(242,193,78,.26) 0%,rgba(224,40,74,.16) 55%,rgba(20,241,199,.08) 100%);
  --chat-bg:rgba(10,7,5,.6);
}
[data-vibe="daylight"]{
  --bg:#EEF2F5; --bg-glow1:rgba(0,168,142,.16); --bg-glow2:rgba(201,149,43,.14); --bg-glow3:rgba(76,201,240,.14);
  --ink:#FFFFFF; --panel:#FFFFFF; --panel2:#F4F7FA; --panel3:#E8EEF3;
  --line:rgba(10,30,45,.10); --line2:rgba(10,30,45,.18);
  --fg:#0B1B26; --fg2:#465A6A; --fg3:#7C8E9C;
  --teal:#00A88E; --teal2:#008C76; --teal-d:#D6F5EF; --gold:#C9952B; --gold2:#A87A18; --on-teal:#FFFFFF;
  --win:#0E9F6E; --loss:#E11D48; --live:#D97706;
  --card-grad:linear-gradient(180deg,#fff,#fbfcfd);
  --hero:linear-gradient(120deg,rgba(0,168,142,.16) 0%,rgba(76,201,240,.12) 50%,rgba(201,149,43,.14) 100%);
  --shadow:0 20px 40px -24px rgba(10,30,45,.35);
  --chat-bg:rgba(8,12,16,.62);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--fg);font:14px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(1100px 620px at 8% -8%,var(--bg-glow1),transparent 62%),radial-gradient(900px 560px at 96% 4%,var(--bg-glow2),transparent 60%),radial-gradient(1000px 700px at 50% 115%,var(--bg-glow3),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--sky)}
[hidden]{display:none!important}
.st-font{font-family:var(--stadium);text-transform:uppercase;letter-spacing:.02em}
.muted{color:var(--fg2)} .dim{color:var(--fg3)} .gold{color:var(--gold)} .win{color:var(--win)} .loss{color:var(--loss)} .teal{color:var(--teal)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
.top-in{max-width:none;margin:0;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.crest{width:64px;height:64px;flex:none;object-fit:contain;border-radius:50%;background:radial-gradient(circle,rgba(242,193,78,.28),rgba(242,193,78,.06) 55%,transparent 72%);filter:drop-shadow(0 6px 14px rgba(0,0,0,.7)) drop-shadow(0 0 10px rgba(242,193,78,.25))}
.brand h1{margin:0;font:900 26px/.9 var(--stadium);text-transform:uppercase;letter-spacing:.04em;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent}
[data-vibe="daylight"] .brand h1{background:linear-gradient(180deg,#B88518,#7A5208);-webkit-background-clip:text;background-clip:text}
.brand small{display:block;color:var(--fg2);font-size:11px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.feed{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:800;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg3);flex:none}
.feed.ok .dot{background:var(--win);animation:ping 2s infinite}
.feed.warn .dot{background:var(--live)} .feed.bad .dot{background:var(--loss)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(46,229,157,.6)}70%{box-shadow:0 0 0 9px rgba(46,229,157,0)}100%{box-shadow:0 0 0 0 rgba(46,229,157,0)}}
.vibewrap{position:relative}
.vibebtn{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-weight:800;font-size:12px}
.vibebtn .sw{width:22px;height:22px;border-radius:7px;background:var(--sw)}
.vibebtn svg{width:14px;height:14px;color:var(--fg2)}
.vibemenu{position:absolute;right:0;top:calc(100% + 8px);z-index:90;width:250px;padding:8px;border-radius:18px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 30px 60px -20px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:6px}
.vopt{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid transparent;background:transparent;text-align:left}
.vopt:hover{background:var(--panel2)}
.vopt[aria-pressed="true"]{border-color:var(--gold)}
.vopt .pv{height:34px;border-radius:9px;background:var(--pv);border:1px solid rgba(255,255,255,.12)}
.vopt b{display:block;font:900 17px/1 var(--stadium);text-transform:uppercase}
.vopt span{font-size:11px;color:var(--fg2)}
.soundpill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid rgba(242,193,78,.5);background:rgba(242,193,78,.12);color:var(--gold);font-weight:800;font-size:12px;white-space:nowrap}
.dk-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:linear-gradient(135deg,#53D337,#1E8E15);color:#06210A;font-weight:900;font-size:12px;text-decoration:none;white-space:nowrap}

/* ---------- record strip ---------- */
.record{max-width:none;margin:0;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.record::-webkit-scrollbar{display:none}
.rec{flex:none;display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.rec b{font:800 16px/1 var(--stadium);letter-spacing:.03em}
.rec .lbl{color:var(--fg2);font-weight:800;font-size:11px}

/* ---------- shell ---------- */
.shell{max-width:none;margin:0;padding:18px max(20px,env(safe-area-inset-right,0px)) 120px max(12px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:228px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:92px;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:24px;background:var(--card-grad),var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:12px 14px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--fg2);font-weight:800;font-size:14px;text-align:left}
.navbtn:hover{background:var(--panel2);color:var(--fg)}
.navbtn[aria-current="page"]{background:linear-gradient(135deg,var(--teal),var(--teal2));color:var(--on-teal);box-shadow:0 12px 26px -12px var(--teal)}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn .cnt{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(127,127,127,.18)}
.rail-foot{margin-top:8px;padding:12px;border-radius:14px;background:var(--panel2);color:var(--fg2);font-size:12px}
.rail-foot label{display:flex;gap:8px;align-items:center;margin-top:8px;cursor:pointer;font-weight:700;color:var(--fg)}
main{min-width:0}
.bottom{display:none}

/* ---------- pulse bar (top stats) ---------- */
.pulse{display:grid;grid-template-columns:1.1fr 1.3fr 1.1fr 1fr 1.2fr;gap:12px;margin-bottom:22px}
.pt{position:relative;overflow:hidden;border-radius:20px;padding:16px 16px 14px;border:1px solid var(--line);background:var(--card-grad),var(--panel);min-width:0;box-shadow:var(--shadow);isolation:isolate}
.pt::after{content:"";position:absolute;inset:auto -30% -60% auto;width:180px;height:180px;border-radius:50%;filter:blur(40px);opacity:.55;z-index:-1}
.pt .k{font-size:11px;font-weight:800;color:var(--fg2);display:flex;align-items:center;gap:6px}
.pt .k svg{width:15px;height:15px}
.pt .v{font:900 36px/1 var(--stadium);margin-top:8px;white-space:nowrap;letter-spacing:.01em}
.pt .s{font-size:12px;color:var(--fg2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt.play{border-color:color-mix(in srgb,var(--teal) 40%,transparent)} .pt.play::after{background:var(--teal)} .pt.play .v{color:var(--teal)}
.pt.max{background:linear-gradient(135deg,rgba(242,193,78,.28),rgba(242,193,78,.06) 60%),var(--panel);border-color:rgba(242,193,78,.5)}
.pt.max::after{background:var(--gold)}
.pt.max .v{background:linear-gradient(100deg,var(--gold2) 0%,var(--gold) 40%,#fff6d6 50%,var(--gold) 60%,var(--gold2) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.pt.max .trophy{position:absolute;right:12px;top:12px;width:38px;height:38px;opacity:.9}
.pt.set.up{border-color:color-mix(in srgb,var(--win) 45%,transparent)} .pt.set.up::after{background:var(--win)} .pt.set.up .v{color:var(--win)}
.pt.set.down{border-color:color-mix(in srgb,var(--loss) 45%,transparent)} .pt.set.down::after{background:var(--loss)} .pt.set.down .v{color:var(--loss)}
.pt.legs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.ring{width:74px;height:74px}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(127,127,127,.18)} .ring .fg{stroke:var(--win);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}
.ring text{font:900 22px var(--stadium);fill:var(--fg);text-anchor:middle;dominant-baseline:central}
.pt.kick{border-color:rgba(255,197,61,.35)} .pt.kick::after{background:var(--live)}
.pt.kick.live{border-color:color-mix(in srgb,var(--loss) 55%,transparent);background:linear-gradient(135deg,rgba(255,59,92,.22),transparent 70%),var(--panel)} .pt.kick.live::after{background:var(--loss)}
.pt.kick .v{color:var(--live)} .pt.kick.live .v{color:var(--loss)}

/* ---------- per-tab identity: every tab gets its own accent + banner ---------- */
body{--acc:var(--teal)}
body[data-view="live"]{--acc:#FF3B5C} body[data-view="pick6"]{--acc:#8B6CFF} body[data-view="ftd"]{--acc:#F2C14E} body[data-view="scalp"]{--acc:#22D3EE}
body[data-view="pickem"]{--acc:#F472B6} body[data-view="games"]{--acc:#2EE59D} body[data-view="injuries"]{--acc:#FF7A59} body[data-view="research"]{--acc:#4CC9F0} body[data-view="ledger"]{--acc:#7CF27C}
.navbtn[aria-current="page"]{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#000))!important;color:#06080b!important;box-shadow:0 12px 26px -12px var(--acc)!important}
.banner{position:relative;overflow:hidden;border-radius:24px;padding:22px 24px;margin-bottom:18px;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);background:radial-gradient(900px 260px at 0% 0%,color-mix(in srgb,var(--acc) 34%,transparent),transparent 70%),linear-gradient(120deg,color-mix(in srgb,var(--acc) 16%,var(--panel)),var(--panel) 70%);box-shadow:var(--shadow);isolation:isolate}
.banner .wm{position:absolute;right:-20px;top:50%;transform:translateY(-50%) rotate(-8deg);width:220px;height:220px;color:var(--acc);opacity:.13;z-index:-1}
.banner .wm svg{width:100%;height:100%}
.banner h2{margin:0;font:900 46px/.92 var(--stadium);text-transform:uppercase;letter-spacing:.01em;color:var(--fg)}
.banner h2 span{color:var(--acc)}
.banner p{margin:8px 0 0;color:var(--fg2);font-size:14px;max-width:70ch}
.banner .bchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.banner .bchips .chip{border-color:color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--fg)}
.sec::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.fbtn[aria-pressed="true"]{background:var(--acc);color:#06080b;border-color:var(--acc)}
.ticket::before{background:linear-gradient(90deg,var(--acc),var(--gold))}
.nolive{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:20px;border:1px dashed color-mix(in srgb,var(--acc) 50%,transparent);background:color-mix(in srgb,var(--acc) 6%,var(--panel));color:var(--fg2);font-weight:700}
.nolive b{display:block;color:var(--fg);font:900 22px/1 var(--stadium);text-transform:uppercase}
.nolive svg{width:34px;height:34px;color:var(--acc);flex:none}
.upnext .gcard{opacity:.88}
.upnext .gcard .g-band{filter:saturate(.75)}
.divider{display:flex;align-items:center;gap:12px;margin:34px 0 14px;color:var(--fg3);font:900 18px/1 var(--stadium);text-transform:uppercase;letter-spacing:.06em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line2)}
/* ---------- headings ---------- */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 0 16px;flex-wrap:wrap}
.vh h2{margin:0;font:900 40px/.95 var(--stadium);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.vh p{margin:6px 0 0;color:var(--fg2);font-size:14px;max-width:64ch}
.sec{margin:28px 0 12px;font:900 24px/1 var(--stadium);text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

/* ---------- generic ---------- */
.card{position:relative;background:var(--card-grad),var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--line2);background:rgba(127,127,127,.08);white-space:nowrap;line-height:1.3}
.chip.teal{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 40%,transparent);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.chip.gold{color:var(--gold);border-color:rgba(242,193,78,.45);background:rgba(242,193,78,.1)}
.chip.win{color:var(--win);border-color:color-mix(in srgb,var(--win) 40%,transparent);background:color-mix(in srgb,var(--win) 10%,transparent)}
.chip.loss{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent);background:color-mix(in srgb,var(--loss) 10%,transparent)}
.chip.boost{color:#E9DDFF;border-color:#7C5CFF;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(124,92,255,.12))}
.chip.live{color:#fff;background:var(--loss);border-color:var(--loss)}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.cd{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:rgba(255,197,61,.12);border:1px solid rgba(255,197,61,.4);color:var(--live);font-weight:900;font-size:12px;white-space:nowrap}
.cd svg{width:12px;height:12px}
.cd.soon{background:var(--live);color:#1a1100;animation:blink 1.4s infinite}
.when{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.when .t{color:var(--fg2);font-weight:700;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fbtn{padding:9px 15px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--fg2);font-weight:800;font-size:12px}
.fbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.empty{padding:34px;text-align:center;color:var(--fg2);border:1px dashed var(--line2);border-radius:var(--r);background:var(--panel)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
details.more{margin-top:12px}
details.more summary{cursor:pointer;color:var(--fg2);font-weight:800;font-size:12px;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2)}
details.more[open] summary::before{content:"–"}
.flash{animation:flash 1.8s ease-out 1}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--gold),0 0 40px var(--gold)}100%{box-shadow:var(--shadow)}}

/* ---------- player tile (the house motif) ---------- */
.ptile{position:relative;border-radius:18px;overflow:hidden;min-height:196px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;border:2px solid rgba(255,255,255,.08);background:var(--tg);color:#fff}
.ptile .jn{position:absolute;right:6px;top:-10px;font:700 104px/1 var(--jersey);color:rgba(255,255,255,.12);z-index:-1}
.ptile .hs{position:absolute;left:50%;top:6px;transform:translateX(-50%);height:118px;width:auto;max-width:none;z-index:-1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.ptile .ini{position:absolute;left:50%;top:30px;transform:translateX(-50%);font:900 46px var(--stadium);color:rgba(255,255,255,.35);z-index:-2}
.ptile .info{padding:42px 10px 10px;background:linear-gradient(180deg,transparent,rgba(3,5,8,.78) 38%,rgba(3,5,8,.94))}
.ptile .nm{font:800 17px/1 var(--stadium);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile .nm small{font:700 11px var(--body);text-transform:none;color:rgba(255,255,255,.65);margin-left:4px}
.ptile .ln{font-size:12px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile .ln span{color:rgba(255,255,255,.6);font-weight:700}
.ptile .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
.ptile .mult{font:800 12px var(--body);color:#FFD66B;display:inline-flex;align-items:center;gap:2px}
.ptile .mult svg{width:11px;height:11px}
.ptile .val{font:700 24px/1 var(--jersey);letter-spacing:.02em}
.ptile .val small{font:700 11px var(--body);color:rgba(255,255,255,.6);margin-left:3px}
.ptile .bar{height:5px;border-radius:999px;background:rgba(255,255,255,.18);margin-top:6px;overflow:hidden}
.ptile .bar i{display:block;height:100%;background:var(--live);border-radius:999px;transition:width .6s}
.ptile .when-t{font-size:10px;font-weight:800;color:rgba(255,255,255,.75);margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ptile .when-t .cd{font-size:10px;padding:1px 7px;background:rgba(0,0,0,.45)}
.badge{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.35);z-index:2}
.badge svg{width:14px;height:14px}
.ptile.hit{border-color:var(--win);box-shadow:0 0 0 1px var(--win),0 0 26px -4px var(--win)}
.ptile.hit .badge{background:var(--win);border-color:var(--win);color:#032015}
.ptile.hit .bar i{background:var(--win)}
.ptile.miss{border-color:var(--loss);filter:saturate(.35)}
.ptile.miss .badge{background:var(--loss);border-color:var(--loss);color:#fff}
.ptile.miss .bar i{background:var(--loss)}
.ptile.live{border-color:var(--live);animation:livering 1.8s infinite}
.ptile.live .badge::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--live);animation:blink 1.1s infinite}
@keyframes livering{50%{box-shadow:0 0 22px -2px var(--live)}}
.ptile.dnp{border-color:var(--violet)}
.ptile.dnp .badge{background:var(--violet);color:#120a2b;font-weight:900;font-size:12px}

/* ---------- Pick6 ticket (DraftKings layout, Poizen skin) ---------- */
.ticket{padding:18px;overflow:hidden}
.ticket::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--teal),var(--gold))}
.ticket.won::before{background:var(--win)} .ticket.lost::before,.ticket.dead::before{background:var(--loss)} .ticket.live::before{background:linear-gradient(90deg,var(--live),var(--loss),var(--live));background-size:200% 100%;animation:shimmer 2s linear infinite}
.t-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.t-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--fg2);font-weight:700;font-size:13px}
.t-meta img{width:22px;height:22px}
.t-title{margin:8px 0 0;font:900 28px/1 var(--stadium);text-transform:uppercase;letter-spacing:.01em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:16px 0}
.t-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.pc .k{font-size:12px;font-weight:800;color:var(--fg2)}
.pc .row{display:flex;align-items:center;gap:10px;margin-top:6px}
.pc b{font:900 26px/1 var(--stadium)}
.dots{display:flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line2)}
.dots i.hit{background:var(--win);border-color:var(--win)} .dots i.miss{background:var(--loss);border-color:var(--loss)} .dots i.live{border-color:var(--live);animation:blink 1.2s infinite}
.money{display:flex;gap:10px;align-items:flex-end}
.money .k{font-size:12px;font-weight:800;color:var(--fg2);margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;font:900 18px/1 var(--stadium);letter-spacing:.02em;background:var(--panel3);border:1px solid var(--line2)}
.pill.towin{background:linear-gradient(135deg,rgba(46,229,157,.25),rgba(46,229,157,.08));border-color:color-mix(in srgb,var(--win) 55%,transparent);color:var(--win)}
.pill.towin.gone{background:rgba(255,59,92,.12);border-color:rgba(255,59,92,.5);color:var(--loss);text-decoration:line-through}
.pill svg{width:16px;height:16px}
.tail{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,#53D337,#1E8E15);color:#06210A;font-weight:900;text-decoration:none;font-size:13px}

/* ---------- live games (broadcast cards) ---------- */
.gcard{overflow:hidden;padding:0}
.g-band{position:relative;padding:14px 16px 12px;background:linear-gradient(110deg,var(--c1) 0%,color-mix(in srgb,var(--c1) 55%,transparent) 42%,color-mix(in srgb,var(--c2) 55%,transparent) 58%,var(--c2) 100%);color:#fff}
.g-band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45));pointer-events:none}
.g-band>*{position:relative;z-index:1}
.g-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800}
.g-head .lg{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.35)}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin-top:10px}
.side{display:flex;align-items:center;gap:10px;min-width:0}
.side.r{flex-direction:row-reverse;text-align:right}
.side img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));background:rgba(255,255,255,.92);border-radius:50%;padding:5px}
.side .tn{font:900 24px/1 var(--stadium)}
.side .tr{font-size:11px;font-weight:700;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sc{font:700 52px/1 var(--jersey);margin-left:auto}
.side.r .sc{margin-left:0;margin-right:auto}
.side.lose .sc{opacity:.55}
.mid{text-align:center;min-width:76px}
.mid .vs{font:900 14px var(--stadium);color:rgba(255,255,255,.7)}
.g-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.implied{display:flex;flex-direction:column;gap:6px}
.implied .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--fg2)}
.implied .barx{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--panel3)}
.implied .barx i{display:block;height:100%}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mtile{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;padding:6px 8px 6px 6px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.mtile .av{width:40px;height:40px;border-radius:12px;overflow:hidden;background:var(--tg);position:relative}
.mtile .av img{position:absolute;left:50%;top:2px;transform:translateX(-50%);height:44px;width:auto;max-width:none}
.mtile b{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile span{display:block;font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile .v{font:700 20px/1 var(--jersey);margin-left:auto}
.mtile.hit{border-color:color-mix(in srgb,var(--win) 60%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--win) 16%,transparent),var(--panel2))}
.mtile.miss{border-color:color-mix(in srgb,var(--loss) 55%,transparent);opacity:.75}
.mtile.live{border-color:color-mix(in srgb,var(--live) 60%,transparent)}
/* MLB at-bat */
.ab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.diamond{width:78px;height:78px}
.diamond .b{fill:transparent;stroke:var(--fg3);stroke-width:2}
.diamond .b.on{fill:var(--live);stroke:var(--live)}
.count{display:flex;gap:12px;font-size:11px;font-weight:800;color:var(--fg2);margin-top:6px}
.count i{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--fg3);margin-left:3px;vertical-align:-1px}
.count i.on.b{background:var(--win);border-color:var(--win)} .count i.on.s{background:var(--live);border-color:var(--live)} .count i.on.o{background:var(--loss);border-color:var(--loss)}
.duel{display:flex;gap:10px;flex-wrap:wrap}
.duel div{display:flex;align-items:center;gap:8px;min-width:0}
.duel img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;background:var(--panel3)}
.duel b{font-size:13px} .duel span{display:block;font-size:10px;font-weight:800;color:var(--fg3)}
.lastplay{font-size:12px;color:var(--fg2);font-style:italic}
.down{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:13px}
.down.rz{border-color:var(--loss);background:linear-gradient(90deg,rgba(255,59,92,.18),var(--panel2))}
.ftdline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}

/* ---------- athlete hero (1st TD / Scalp / Research) ---------- */
.ath{overflow:hidden;padding:0}
.ath-hero{position:relative;height:210px;display:flex;align-items:flex-end;overflow:hidden;background:var(--tg);color:#fff}
.ath-hero .jn{position:absolute;right:-4px;bottom:-26px;font:700 190px/1 var(--jersey);color:rgba(255,255,255,.11)}
.ath-hero .hs{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:200px;width:auto;max-width:none;filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
.ath-hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(3,5,8,.92))}
.ath-hero .nm{position:relative;padding:14px 16px;width:100%}
.ath-hero .nm small{display:block;font-size:12px;font-weight:800;color:rgba(255,255,255,.8)}
.ath-hero .nm b{display:block;font:900 32px/.95 var(--stadium);text-transform:uppercase;text-wrap:balance}
.ath-hero .corner{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ath-hero .corner .chip{background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.25);color:#fff}
.ath-hero .lefttop{position:absolute;top:12px;left:12px}
.ath-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ath-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.payline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(242,193,78,.18),rgba(242,193,78,.04));border:1px solid rgba(242,193,78,.4)}
.payline .k{font-size:12px;font-weight:800;color:var(--fg2)}
.payline .v{font:900 30px/1 var(--stadium);color:var(--gold)}
.status{font-size:13px;font-weight:800;padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--panel2)}
.status.gold{border-color:var(--gold);background:linear-gradient(135deg,rgba(242,193,78,.3),rgba(242,193,78,.08));color:var(--gold);animation:glow 1.5s infinite}
.status.win{border-color:var(--win);background:color-mix(in srgb,var(--win) 14%,transparent);color:var(--win)}
.status.loss{border-color:color-mix(in srgb,var(--loss) 60%,transparent);background:color-mix(in srgb,var(--loss) 10%,transparent);color:var(--loss)}
@keyframes glow{50%{box-shadow:0 0 26px rgba(242,193,78,.45)}}
.tds{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:800;color:var(--fg2)}
.tds i{width:30px;height:12px;border-radius:999px;background:rgba(127,127,127,.22)}
.tds i.on{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.ath.hit .ath-hero{box-shadow:inset 0 0 0 3px var(--win)}
.plan{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;border:1px dashed rgba(242,193,78,.5);background:rgba(242,193,78,.06);color:var(--fg2);font-size:13px;margin-bottom:16px}
.plan b{color:var(--gold)}

/* scalp */
.shifts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.shift{position:relative;overflow:hidden;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card-grad),var(--panel);text-align:left;display:flex;flex-direction:column;gap:6px}
.shift[aria-pressed="true"]{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset,0 14px 30px -18px var(--teal)}
.shift .k{font:900 15px/1 var(--stadium);text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.shift .faces{display:flex}
.shift .faces span{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--tg);border:2px solid var(--panel);margin-right:-8px;position:relative}
.shift .faces img{position:absolute;left:50%;top:1px;transform:translateX(-50%);height:38px;width:auto;max-width:none}
.shift b{font-weight:800;font-size:13px}
.bank{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;margin-top:16px}
.bank .k{font-size:12px;font-weight:800;color:var(--fg2)}
.bank .v{font:900 30px/1 var(--stadium);margin-top:6px}

/* ---------- injuries ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.inp{padding:10px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);min-width:0;font:inherit}
.team-inj{overflow:hidden;padding:0}
.ti-head{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#fff;background:linear-gradient(110deg,var(--c1),color-mix(in srgb,var(--c1) 40%,transparent) 70%,transparent)}
.ti-head img{width:40px;height:40px;background:rgba(255,255,255,.92);border-radius:50%;padding:4px}
.ti-head b{font:900 22px/1 var(--stadium);text-transform:uppercase}
.ti-head span{margin-left:auto;font-size:12px;font-weight:800;background:rgba(0,0,0,.35);padding:3px 9px;border-radius:999px}
.irow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.irow .av{width:52px;height:52px;border-radius:14px;overflow:hidden;position:relative;background:var(--tg)}
.irow .av img{position:absolute;left:50%;top:2px;transform:translateX(-50%);height:58px;width:auto;max-width:none}
.irow .nmrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.irow .nmrow b{font-size:15px}
.irow .pos{font-size:11px;font-weight:800;color:var(--fg3)}
.irow p{margin:4px 0 0;color:var(--fg2);font-size:13px;line-height:1.45}
.irow .dt{font-size:11px;color:var(--fg3);margin-top:3px;font-weight:700}
.irow.mine{background:linear-gradient(90deg,rgba(242,193,78,.14),transparent 70%);box-shadow:inset 3px 0 0 var(--gold)}
.irow.edge{box-shadow:inset 3px 0 0 var(--teal)}
.s-out{color:#fff;background:var(--loss);border-color:var(--loss)}
.s-doubt{color:#1d0f00;background:#FB923C;border-color:#FB923C}
.s-q{color:#1a1100;background:var(--live);border-color:var(--live)}
.s-ir{color:#fff;background:#6D4FE0;border-color:#6D4FE0}
.s-act{color:var(--win);border-color:color-mix(in srgb,var(--win) 40%,transparent)}

.masonry{columns:360px;column-gap:16px}.masonry>*{break-inside:avoid;margin-bottom:16px;display:block}

/* ---------- research ---------- */
.checkbar{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 110px auto;gap:8px;padding:14px;margin-bottom:18px}
.verdict{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font:900 15px/1 var(--stadium);letter-spacing:.02em}
.verdict.good{background:var(--win);color:#032015} .verdict.mid{background:var(--live);color:#1a1100} .verdict.bad{background:var(--loss);color:#fff}
.stats6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stats6>div{padding:10px 6px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:center}
.stats6 .k{font-size:10px;font-weight:800;color:var(--fg3)}
.stats6 .v{font:900 22px/1.1 var(--stadium)}
.chart{position:relative;height:150px;display:flex;align-items:flex-end;gap:8px;padding:18px 4px 0;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .col i{display:block;width:100%;max-width:46px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,#5b6b7c,#334155)}
.chart .col i.ov{background:linear-gradient(180deg,var(--win),color-mix(in srgb,var(--win) 50%,#000))}
.chart .col span{font:700 15px/1 var(--jersey);margin-bottom:4px}
.chart .col em{font-style:normal;font-size:10px;color:var(--fg3);margin-top:5px;font-weight:800;white-space:nowrap}
.chart .ref{position:absolute;left:0;right:0;pointer-events:none}
.chart .ref.line{border-top:2px dashed var(--gold)}
.chart .ref.avg{border-top:1px solid var(--sky);opacity:.7}
.chart .ref b{position:absolute;right:0;top:-17px;font-size:10px;font-weight:900;padding:0 5px;border-radius:6px;background:var(--panel)}
.chart .ref.line b{color:var(--gold)} .chart .ref.avg b{color:var(--sky);right:auto;left:0}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ladder div{padding:8px 4px;border-radius:12px;text-align:center;border:1px solid var(--line);background:var(--panel2)}
.ladder div.cur{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.ladder .l{font-size:11px;font-weight:800;color:var(--fg2)}
.ladder .p{font:900 20px/1.1 var(--stadium)}
.ladder .heat{height:4px;border-radius:999px;margin-top:5px;background:var(--panel3);overflow:hidden}
.ladder .heat i{display:block;height:100%}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{padding:9px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.kv .k{font-size:11px;font-weight:800;color:var(--fg3)} .kv .v{font-weight:800;font-size:14px;margin-top:2px}
.subh{font-size:12px;font-weight:900;color:var(--fg2);margin:4px 0 -2px}

/* ---------- ledger ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px}
.kpi .k{font-size:12px;font-weight:900;color:var(--fg2);text-transform:uppercase;font-family:var(--stadium);letter-spacing:.06em;font-size:15px}
.kpi .rec{all:unset;display:block;font:900 40px/1 var(--stadium);margin-top:6px}
.kpi .pl{font:900 20px/1 var(--stadium);margin-top:6px}
.kpi .sub{font-size:12px;color:var(--fg2);margin-top:4px}
.plchart{padding:16px}
.plchart svg{width:100%;height:220px;display:block}
.ltable{width:100%;border-collapse:collapse;font-size:13px}
.ltable th{text-align:left;font-size:11px;color:var(--fg3);font-weight:900;padding:8px 10px}
.ltable td{padding:10px;border-top:1px solid var(--line)}
.ltable td.n{text-align:right;font-weight:800}
.tablewrap{overflow-x:auto}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:rgba(6,9,12,.94);color:#fff;border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 50px -12px rgba(0,0,0,.85);animation:tin .45s cubic-bezier(.2,1.2,.3,1);text-align:left;cursor:pointer}
.toast::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--teal)}
.toast.win::before{background:var(--win)} .toast.gold::before{background:var(--gold)} .toast.loss::before{background:var(--loss)} .toast.warn::before{background:var(--violet)}
.toast.gold{border-color:rgba(242,193,78,.6);box-shadow:0 0 34px -6px rgba(242,193,78,.6)}

.chat-h select{margin-left:auto;padding:6px 8px;border-radius:10px;background:rgba(0,0,0,.5);color:#F4F1EA;border:1px solid rgba(242,193,78,.35);font-size:12px}
.chat-h .x{background:none;border:0;font-size:22px;color:rgba(244,241,234,.6);padding:2px 6px}
.chat-list{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.msg .who{font-size:12px;font-weight:900;color:#9FD8FF;display:flex;gap:6px;align-items:center}

.msg.owner .who{color:#F2C14E}
.msg .txt{margin-top:3px;font-size:14px;color:#F4F1EA;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.owner .txt{padding:8px 10px;border-radius:12px;background:rgba(242,193,78,.1);border:1px solid rgba(242,193,78,.3)}
.vbadge{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:2px 6px;border-radius:999px;background:linear-gradient(135deg,#FFDF8A,#F2C14E);color:#1C1302;font-weight:900;letter-spacing:.06em}
.chat-f{border-top:1px solid rgba(242,193,78,.22);padding:10px;display:flex;flex-direction:column;gap:8px}
.chat-f .row{display:flex;gap:8px}
.chat-f input,.chat-f textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(242,193,78,.3);background:rgba(0,0,0,.3);color:#F4F1EA;font:inherit;font-size:13px}
.chat-f textarea{resize:none;height:46px}
.chat-f button{padding:0 18px;border-radius:12px;border:0;background:linear-gradient(135deg,#FFDF8A,#F2C14E);color:#1C1302;font-weight:900}

/* ---------- team picker + team skin ---------- */
.vibemenu{width:min(380px,calc(100vw - 24px));max-height:min(80vh,640px);overflow-y:auto}
.vm-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 6px 2px;font:900 14px/1 var(--stadium);text-transform:uppercase;letter-spacing:.06em;color:var(--fg2)}
.vm-h span{font:700 11px var(--body);text-transform:none;letter-spacing:0;color:var(--fg3)}
.vm-q{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);font:inherit;font-size:13px}
.vm-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;border-radius:12px;background:var(--panel2)}
.vm-tabs button{padding:7px;border-radius:9px;border:0;background:transparent;font-weight:900;font-size:12px;color:var(--fg2)}

.vm-teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-height:300px;overflow-y:auto;padding:2px}

.vm-team img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

.vm-team:hover{transform:translateY(-1px);box-shadow:0 0 0 1px var(--c2)}
.vm-team[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c2),0 0 18px -4px var(--c2)}
.vm-team.wide{grid-column:span 2;flex-direction:row;justify-content:flex-start;padding:8px 10px;font-size:11px}

.vibebtn .tlogo{width:22px;height:22px;object-fit:contain}
html[data-team] body{--acc:var(--team-acc)}
html[data-team] .navbtn[aria-current="page"],html[data-team] .fbtn[aria-pressed="true"],html[data-team] .weekbar .wk[aria-pressed="true"],html[data-team] .lstrip .go{color:var(--team-on)!important}
html[data-team] .brand h1{background:linear-gradient(180deg,#fff,var(--team-acc) 70%,color-mix(in srgb,var(--team-acc) 60%,#000));-webkit-background-clip:text;background-clip:text}
html[data-team] body::after{content:"";position:fixed;right:-6vw;bottom:-8vh;width:min(62vw,720px);height:min(62vw,720px);background:var(--team-logo) center/contain no-repeat;opacity:.05;pointer-events:none;z-index:-1}
html[data-team] .rail{background:linear-gradient(180deg,color-mix(in srgb,var(--team-a) 26%,var(--panel)),var(--panel) 45%);border-color:color-mix(in srgb,var(--team-acc) 30%,var(--line))}
html[data-team] .top{border-bottom-color:color-mix(in srgb,var(--team-acc) 40%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--team-b) 40%,transparent)}
html[data-team] .pt.play .v{color:var(--team-acc)}
html[data-team] .chat-fab{border-color:var(--team-acc);color:var(--team-acc)}
body.overlay::after{display:none}
/* ---------- sweat cockpit ---------- */
.hwrap{display:grid;place-items:center} .hring{display:block;color:var(--fg)}
main details.slip>summary{grid-template-columns:auto auto minmax(0,1fr) minmax(120px,220px) auto auto 20px}
main details.slip.dead>summary,main details.slip.won>summary,main details.slip.lost>summary,main details.slip.partial>summary{grid-template-columns:auto minmax(0,1fr) minmax(120px,220px) auto auto 20px}
.cascade{margin:0 16px 8px;padding:9px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--loss) 50%,transparent);background:color-mix(in srgb,var(--loss) 10%,transparent);font-size:12px;font-weight:800;color:var(--loss)}
.lhero .row2{margin-top:14px}
.btn-sweat{padding:10px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--fg);font-weight:900;font-size:13px}
.btn-sweat:hover{background:color-mix(in srgb,var(--acc) 28%,transparent)}
.tape{display:flex;gap:8px;overflow-x:auto;padding:10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);scrollbar-width:thin}
.tape.empty{color:var(--fg3);font-size:12px;font-weight:700}
.tp{flex:none;display:flex;flex-direction:column;gap:2px;min-width:170px;max-width:260px;padding:8px 11px;border-radius:12px;background:var(--panel2);border-left:3px solid var(--teal)}
.tp.win{border-left-color:var(--win)} .tp.loss{border-left-color:var(--loss)} .tp.gold{border-left-color:var(--gold)} .tp.warn{border-left-color:var(--violet)}
.tp time{font-size:10px;font-weight:900;color:var(--fg3)} .tp b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tp em{font-style:normal;font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aprefs{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12px;font-weight:800;color:var(--fg2)}
.aprefs label{display:inline-flex;gap:6px;align-items:center}
.aprefs select{padding:5px 8px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);font:inherit}
.sweat{position:fixed;inset:0;z-index:92;background:radial-gradient(900px 500px at 10% 0%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%),var(--bg);overflow-y:auto;padding:24px clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:20px}
body.sweating{overflow:hidden}
.sw-top{display:flex;gap:clamp(16px,4vw,56px);align-items:flex-end;flex-wrap:wrap}
.sw-k{font:900 14px/1 var(--stadium);text-transform:uppercase;letter-spacing:.08em;color:var(--fg2)}
.sw-big{font:700 clamp(48px,7vw,104px)/1 var(--jersey);letter-spacing:.01em} .sw-big.gold{color:var(--gold)} .sw-big span{font-size:.45em;color:var(--fg3)}
.sw-games{display:flex;gap:6px;flex-wrap:wrap;align-self:center}
.sw-x{margin-left:auto;align-self:flex-start;padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font-weight:900}
.sw-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px;align-items:start}
.sw-slips{display:flex;flex-direction:column;gap:10px}
.sw-slip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:14px 18px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.sw-slip.dead{opacity:.45}
.sw-sl b{display:block;font:900 clamp(20px,2.2vw,30px)/1 var(--stadium);text-transform:uppercase} .sw-sl span{display:block;font-size:13px;font-weight:700;color:var(--fg2);margin:4px 0 8px}
.sw-slip .segs{height:16px}
.sw-danger{padding:16px;border-radius:20px;background:var(--panel);border:1px solid color-mix(in srgb,var(--loss) 40%,transparent);display:flex;flex-direction:column;gap:10px}
.sw-leg{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center}
.sw-leg .av{width:52px;height:52px;border-radius:14px;overflow:hidden;position:relative;background:var(--tg)}
.sw-leg .av img{position:absolute;left:50%;top:2px;transform:translateX(-50%);height:58px;width:auto;max-width:none}
.sw-leg b{display:block;font-size:16px} .sw-leg span{font-size:13px;color:var(--fg2);font-weight:700} .sw-leg em{font:900 30px/1 var(--stadium);font-style:normal}
.sweat .tape{background:var(--panel)}
body.overlay .sweat{background:transparent}
.dhealth{margin-top:8px;padding:12px;border-radius:14px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.dh-h{font:900 13px/1 var(--stadium);text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin-bottom:2px}
.dh{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:11px;font-weight:700;color:var(--fg2)}
.dh i{width:8px;height:8px;border-radius:50%;background:var(--fg3)} .dh.ok i{background:var(--win)} .dh.warn i{background:var(--live)} .dh.bad i{background:var(--loss);animation:blink 1.1s infinite}
.dh em{font-style:normal;color:var(--fg3);white-space:nowrap}
@media (max-width:900px){.sw-body{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){main details.slip>summary{grid-template-columns:auto minmax(0,1fr) auto!important}main details.slip>summary .faces{display:none}main details.slip>summary .segs{grid-column:1 / 3;grid-row:2}main details.slip>summary .odds{grid-column:3;grid-row:2}main details.slip>summary .chev{display:none}}
/* ---------- debrief / simulator / chain ---------- */
.debrief{padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:6px;border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:radial-gradient(600px 200px at 100% 0,rgba(242,193,78,.12),transparent 70%),var(--panel)}
details.scen{border-radius:14px;border:1px dashed var(--line2);padding:10px 12px}
details.scen>summary{cursor:pointer;font-weight:900;font-size:13px;color:var(--fg2);list-style:none}
details.scen>summary::-webkit-details-marker{display:none}
details.scen>summary::before{content:"+ ";color:var(--acc)} details.scen[open]>summary::before{content:"– "}
.scen-out{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);font-size:13px;font-weight:700;color:var(--fg2)}
.scen-out b{color:var(--fg)}
.chain{display:flex;align-items:stretch;gap:6px;overflow-x:auto;margin:0 0 16px;padding-bottom:4px}
.cn{flex:none;min-width:120px;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.cn .k{font:900 13px/1 var(--stadium);text-transform:uppercase;color:var(--fg2)} .cn .v{font:900 24px/1.1 var(--stadium);margin-top:6px} .cn .s{font-size:11px;font-weight:700;color:var(--fg3)}
.cn.up{border-color:color-mix(in srgb,var(--win) 50%,transparent)} .cn.down{border-color:color-mix(in srgb,var(--loss) 50%,transparent)} .cn.live{border-color:var(--live);animation:livering 1.8s infinite}
.cn.end{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 18%,var(--panel)),var(--panel));border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.chain .arr{flex:none;align-self:center;width:18px;height:2px;background:var(--line2);position:relative}
.chain .arr::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--line2)}
/* ---------- stream moments (full-screen reactions) ---------- */
.moments{position:fixed;inset:0;z-index:95;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.mo{position:absolute;inset:0;display:grid;place-items:center;animation:moFade var(--dur,3.4s) ease forwards}
@keyframes moFade{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}
.mo .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--mc) 0%,transparent 60%);opacity:.0;animation:moFlash .9s ease-out}
@keyframes moFlash{0%{opacity:.75}100%{opacity:0}}
.mo .rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--mc) 30%,transparent) 0deg 7deg,transparent 7deg 20deg);animation:moSpin 6s linear infinite;mask:radial-gradient(circle,#000 0,transparent 55%);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes moSpin{to{transform:rotate(360deg)}}
.mo .core{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;animation:moPop .7s cubic-bezier(.2,1.6,.3,1)}
@keyframes moPop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.mo .face{width:min(30vmin,240px);height:min(30vmin,240px);border-radius:50%;overflow:hidden;position:relative;background:var(--tg,#123);box-shadow:0 0 0 6px var(--mc),0 0 70px var(--mc)}
.mo .face img{position:absolute;left:50%;top:6%;transform:translateX(-50%);height:118%;width:auto;max-width:none}
.mo .crestbig{width:min(34vmin,280px);filter:drop-shadow(0 0 40px var(--mc))}
.mo .word{font:900 min(16vmin,150px)/.85 var(--stadium);text-transform:uppercase;letter-spacing:.02em;color:#fff;text-shadow:0 0 30px var(--mc),0 6px 0 rgba(0,0,0,.45);-webkit-text-stroke:2px var(--mc);text-align:center}
.mo .sub{font:800 min(4.6vmin,34px)/1.1 var(--body);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.9);text-align:center;padding:6px 18px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid var(--mc)}
.mo.bust .core{animation:moPop .5s ease,moShake .5s .5s 2}
@keyframes moShake{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.mo .p{position:absolute;top:-6vh;width:var(--s,14px);height:var(--s,14px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6D6,#F2C14E 45%,#8A6414);animation:moRain var(--t,2.6s) linear var(--d,0s) forwards}
@keyframes moRain{to{transform:translateY(115vh) rotate(540deg)}}
.mo .spark{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:2px;background:var(--mc);animation:moBurst 1.2s ease-out forwards}
@keyframes moBurst{0%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(0);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--r));opacity:0}}
body:not(.overlay) .mo .word{font-size:min(12vmin,110px)}
/* ---------- overlay mode (OBS) ---------- */
body.overlay{background:transparent!important}
body.overlay .top,body.overlay .record,body.overlay .shell,body.overlay .bottom,body.overlay .chat-fab{display:none!important}
.ticker{display:none}
body.overlay .ticker{display:flex;position:fixed;left:16px;right:16px;bottom:16px;z-index:50;align-items:stretch;border-radius:18px;overflow:hidden;background:rgba(4,6,8,.9);border:1px solid rgba(242,193,78,.5);box-shadow:0 20px 40px -10px rgba(0,0,0,.7);color:#fff}
.ticker .tag{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;background:linear-gradient(135deg,#0A3F3A,#0FB89A);font:900 22px/1 var(--stadium);text-transform:uppercase;color:#F2C14E}
.ticker .tag img{width:44px;height:44px;object-fit:contain}
.ticker .scroll{flex:1;overflow:hidden;display:flex;align-items:center}
.ticker .track{display:flex;gap:30px;padding:13px 0;white-space:nowrap;animation:scroll 45s linear infinite;font-weight:800;font-size:16px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
body.overlay .toasts{bottom:96px}

/* ---------- icon sizing guards (unsized inline svgs blow up to full width) ---------- */
.plan svg{width:20px;height:20px;flex:none;color:var(--gold)}
.ftdline svg{width:18px;height:18px;flex:none;color:var(--gold)}
.chip svg{width:12px;height:12px;flex:none}
.status svg,.weekbar svg,.lstrip svg{width:16px;height:16px;flex:none}

/* ---------- crest placements ---------- */
.rail-crest{margin-top:8px;padding:12px 10px 10px;border-radius:16px;background:radial-gradient(circle at 50% 40%,rgba(242,193,78,.12),transparent 70%),var(--panel2);text-align:center}
.rail-crest img{width:100%;max-width:170px;display:block;margin:0 auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.rail-crest span{display:block;margin-top:6px;font:800 12px/1.2 var(--stadium);text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.chat::before{content:"";position:absolute;inset:60px 0 120px;background:url(crest.png) center/78% no-repeat;opacity:.07;pointer-events:none}
.chat>*{position:relative}

/* ---------- compact live strip on non-live tabs ---------- */
.lstrip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;margin:-6px 0 18px;border-radius:16px;border:1px solid color-mix(in srgb,var(--loss) 50%,transparent);background:linear-gradient(90deg,rgba(255,59,92,.16),var(--panel) 60%);font-weight:800;font-size:13px}
.lstrip .go{margin-left:auto;padding:7px 12px;border-radius:999px;border:0;background:var(--loss);color:#fff;font-weight:900;font-size:12px}

/* ---------- week switcher ---------- */
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.weekbar .wk{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--fg2);font-weight:800;font-size:13px}
.weekbar .wk[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#06080b}
.weekbar .wk small{font-weight:700;opacity:.75}
.weekbar .hint{font-size:12px;color:var(--fg3);font-weight:700}

<script>/* Poizen Lounge — grading engine (pure functions, no DOM).
   Works in the browser (window.PZE) and in Node (module.exports) for tests.
   Data source: ESPN public site API (scoreboard + game summary). */
(function (root) {
  'use strict';

  const ESPN = {
    scoreboard: (sport) => `https://site.api.espn.com/apis/site/v2/sports/${sportPath(sport)}/scoreboard`,
    summary: (sport, id) => `https://site.api.espn.com/apis/site/v2/sports/${sportPath(sport)}/summary?event=${id}`,
    gamelog: (id) => `https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/${id}/gamelog`,
    injuries: () => 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries',
    search: (q) => `https://site.web.api.espn.com/apis/common/v3/search?query=${encodeURIComponent(q)}&type=player&limit=6`,
  };
  function sportPath(s) { return s === 'mlb' ? 'baseball/mlb' : 'football/nfl'; }

  // ---------- names ----------
  function norm(name) {
    return String(name || '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/[.'’`]/g, '')
      .replace(/-/g, ' ')
      .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, ' ')
      .replace(/[^a-z ]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // ---------- odds ----------
  function americanToDecimal(odds) {
    const n = Number(String(odds).replace('+', ''));
    if (!isFinite(n) || n === 0) return null;
    return n > 0 ? 1 + n / 100 : 1 + 100 / Math.abs(n);
  }

  // ---------- number parsing ----------
  function num(v) {
    if (v === undefined || v === null || v === '' || v === '-' || v === '--') return 0;
    const n = Number(v);
    return isFinite(n) ? n : 0;
  }
  function ipToOuts(ip) { // "5.2" -> 17 outs
    const [w, p] = String(ip || '0').split('.');
    return num(w) * 3 + num(p);
  }

  // ---------- summary parsing ----------
  function gameStatus(summary) {
    const comp = summary && summary.header && summary.header.competitions && summary.header.competitions[0];
    const st = (comp && comp.status) || {};
    const t = st.type || {};
    return {
      state: t.state || 'pre',               // pre | in | post
      name: t.name || '',
      completed: !!t.completed,
      detail: t.shortDetail || t.detail || '',
      period: st.period || 0,
      clock: st.displayClock || '',
      postponed: /POSTPONED|CANCELED|CANCELLED|SUSPENDED/.test(t.name || ''),
    };
  }

  function emptyStats() {
    return {
      passYds: 0, passTD: 0, passAtt: 0, completions: 0, ints: 0,
      rushYds: 0, rushTD: 0, rushAtt: 0,
      rec: 0, recYds: 0, recTD: 0, targets: 0,
      // mlb batting
      h: 0, r: 0, rbi: 0, hr: 0, bb: 0, k: 0, ab: 0,
      // mlb pitching
      pK: 0, pOuts: 0, pER: 0, pH: 0,
    };
  }

  function parseBox(summary, sport) {
    const players = {}; // key: espn id
    const byName = {};  // norm name -> id
    const teams = (summary && summary.boxscore && summary.boxscore.players) || [];
    for (const t of teams) {
      const team = t.team && t.team.abbreviation;
      for (const cat of t.statistics || []) {
        const keys = cat.keys || [];
        const kind = cat.name || cat.type;
        for (const a of cat.athletes || []) {
          const id = String(a.athlete && a.athlete.id);
          const name = a.athlete && a.athlete.displayName;
          if (!players[id]) players[id] = { id, name, team, stats: emptyStats(), cats: [] };
          const p = players[id];
          p.cats.push(kind);
          byName[norm(name)] = id;
          const v = {};
          keys.forEach((k, i) => { v[k] = (a.stats || [])[i]; });
          const s = p.stats;
          if (sport === 'mlb') {
            if (kind === 'batting') {
              s.h += num(v.hits); s.r += num(v.runs); s.rbi += num(v.RBIs); s.hr += num(v.homeRuns);
              s.bb += num(v.walks); s.k += num(v.strikeouts); s.ab += num(v.atBats);
            } else if (kind === 'pitching') {
              s.pK += num(v.strikeouts); s.pER += num(v.earnedRuns); s.pH += num(v.hits);
              s.pOuts += ipToOuts(v['fullInnings.partInnings']);
            }
          } else {
            if (kind === 'passing') {
              const ca = String(v['completions/passingAttempts'] || '0/0').split('/');
              s.completions += num(ca[0]); s.passAtt += num(ca[1]);
              s.passYds += num(v.passingYards); s.passTD += num(v.passingTouchdowns); s.ints += num(v.interceptions);
            } else if (kind === 'rushing') {
              s.rushAtt += num(v.rushingAttempts); s.rushYds += num(v.rushingYards); s.rushTD += num(v.rushingTouchdowns);
            } else if (kind === 'receiving') {
              s.rec += num(v.receptions); s.recYds += num(v.receivingYards); s.recTD += num(v.receivingTouchdowns);
              s.targets += num(v.receivingTargets);
            }
          }
        }
      }
    }
    return { players, byName };
  }

  // Scorer of a touchdown play, from ESPN text like
  // "J.K. Dobbins 4 Yd Rush (Wil Lutz Kick)" or "Rashid Shaheed 42 Yd pass from Sam Darnold (...)"
  function tdScorerFromText(text) {
    const m = String(text || '').match(/^(.+?)\s+-?\d+\s+(Yd|Yard|Yds)/i);
    if (m) return m[1].trim();
    const m2 = String(text || '').match(/^([^\d(]+?)\s+\d/);
    return m2 ? m2[1].trim() : null;
  }

  function scoringPlays(summary) {
    return ((summary && summary.scoringPlays) || []).map((p) => {
      const isTD = ((p.scoringType && p.scoringType.abbreviation) || (p.type && p.type.abbreviation)) === 'TD';
      const scorer = isTD ? tdScorerFromText(p.text) : null;
      return {
        isTD, scorer, scorerNorm: scorer ? norm(scorer) : null,
        text: (p.text || '').trim(), team: p.team && p.team.abbreviation,
        period: p.period && p.period.number, clock: p.clock && p.clock.displayValue,
      };
    });
  }

  function parseGame(summary, sport) {
    const status = gameStatus(summary);
    const box = parseBox(summary, sport);
    const plays = sport === 'nfl' ? scoringPlays(summary) : [];
    const firstTD = plays.find((p) => p.isTD) || null;
    const comp = summary && summary.header && summary.header.competitions && summary.header.competitions[0];
    const score = {};
    for (const c of (comp && comp.competitors) || []) score[c.team && c.team.abbreviation] = num(c.score);
    return { sport, status, box, plays, firstTD, score };
  }

  // ---------- markets ----------
  const MARKETS = {
    // NFL
    pass_yds: { sport: 'nfl', label: 'Passing Yards', short: 'Pass Yds', f: (s) => s.passYds },
    pass_td: { sport: 'nfl', label: 'Passing TDs', short: 'Pass TD', f: (s) => s.passTD },
    pass_att: { sport: 'nfl', label: 'Pass Attempts', short: 'Pass Att', f: (s) => s.passAtt },
    completions: { sport: 'nfl', label: 'Completions', short: 'Comp', f: (s) => s.completions },
    rush_yds: { sport: 'nfl', label: 'Rushing Yards', short: 'Rush Yds', f: (s) => s.rushYds },
    rush_att: { sport: 'nfl', label: 'Rush Attempts', short: 'Carries', f: (s) => s.rushAtt },
    rec_yds: { sport: 'nfl', label: 'Receiving Yards', short: 'Rec Yds', f: (s) => s.recYds },
    receptions: { sport: 'nfl', label: 'Receptions', short: 'Rec', f: (s) => s.rec },
    rush_rec_yds: { sport: 'nfl', label: 'Rush + Rec Yards', short: 'Rush+Rec Yds', f: (s) => s.rushYds + s.recYds },
    pass_rush_yds: { sport: 'nfl', label: 'Pass + Rush Yards', short: 'Pass+Rush Yds', f: (s) => s.passYds + s.rushYds },
    anytime_td: { sport: 'nfl', label: 'Rush + Rec TDs', short: 'TDs', f: (s) => s.rushTD + s.recTD },
    interceptions: { sport: 'nfl', label: 'Interceptions Thrown', short: 'INT', f: (s) => s.ints },
    // MLB
    hrr: { sport: 'mlb', label: 'Hits + Runs + RBIs', short: 'H+R+RBI', f: (s) => s.h + s.r + s.rbi },
    hits: { sport: 'mlb', label: 'Hits', short: 'Hits', f: (s) => s.h },
    runs: { sport: 'mlb', label: 'Runs', short: 'Runs', f: (s) => s.r },
    rbis: { sport: 'mlb', label: 'RBIs', short: 'RBI', f: (s) => s.rbi },
    home_runs: { sport: 'mlb', label: 'Home Runs', short: 'HR', f: (s) => s.hr },
    batter_ks: { sport: 'mlb', label: 'Batter Strikeouts', short: 'K', f: (s) => s.k },
    pitcher_ks: { sport: 'mlb', label: 'Pitcher Strikeouts', short: 'Ks', f: (s) => s.pK },
    pitcher_outs: { sport: 'mlb', label: 'Pitching Outs', short: 'Outs', f: (s) => s.pOuts },
  };

  function findPlayer(game, ref) {
    if (!game) return null;
    const { players, byName } = game.box;
    if (ref.espnId && players[String(ref.espnId)]) return players[String(ref.espnId)];
    const id = byName[norm(ref.name)];
    if (id) return players[id];
    // last-name + team fallback ("Jose Ramirez" vs "José Ramírez" handled by norm; this covers "Kenneth Walker" vs "Kenneth Walker III")
    const n = norm(ref.name);
    const hit = Object.values(players).find((p) => {
      const pn = norm(p.name);
      return (pn.startsWith(n) || n.startsWith(pn)) && (!ref.team || p.team === ref.team);
    });
    return hit || null;
  }

  /* Grade one prop leg.
     leg: { name, espnId, team, market, line, dir: 'over'|'under' }
     game: parseGame() result or null (not started / not found)
     returns { state, value, line, progress, note }
       state: scheduled | live | hit | miss | dnp | void */
  function gradeLeg(leg, game) {
    const line = Number(leg.line);
    const dir = leg.dir === 'under' ? 'under' : 'over';
    const mk = MARKETS[leg.market];
    if (!mk) return { state: 'error', value: null, line, progress: 0, note: `Unknown market "${leg.market}"` };
    if (!game || game.status.state === 'pre') return { state: 'scheduled', value: 0, line, progress: 0, note: '' };
    if (game.status.postponed) return { state: 'void', value: null, line, progress: 0, note: 'Game postponed — check DraftKings void rules' };
    const p = findPlayer(game, leg);
    const value = p ? mk.f(p.stats) : 0;
    const final = game.status.state === 'post';
    const progress = line > 0 ? Math.min(1, value / line) : (value > 0 ? 1 : 0);
    if (dir === 'over') {
      if (value > line) return { state: 'hit', value, line, progress: 1, note: final ? 'Final' : 'Cleared' };
      if (final) {
        if (!p) return { state: 'dnp', value: 0, line, progress: 0, note: 'No stats recorded — may be void (DNP). DraftKings rules decide.' };
        return { state: 'miss', value, line, progress, note: 'Final' };
      }
      return { state: 'live', value, line, progress, note: p ? `Needs ${fmt(line - value + (Number.isInteger(line) ? 1 : 0.5))} more` : 'No stats yet' };
    }
    // under
    if (value > line) return { state: 'miss', value, line, progress: 1, note: 'Went over' };
    if (final) {
      if (!p) return { state: 'dnp', value: 0, line, progress: 0, note: 'No stats recorded — may be void (DNP). DraftKings rules decide.' };
      return { state: 'hit', value, line, progress, note: 'Final' };
    }
    return { state: 'live', value, line, progress, note: `${fmt(line - value)} of room left` };
  }

  function fmt(n) {
    if (n === null || n === undefined || !isFinite(n)) return '–';
    return Number.isInteger(n) ? String(n) : n.toFixed(1);
  }

  // ---------- tickets ----------
  /* Pick6 entry: { entry, legs:[...], payouts:{ "8":221.9, "7":5.5 } | null, toWin }
     payouts are DraftKings multipliers on the entry by number correct (when known). */
  function gradePick6(slip, gameFor) {
    const legs = slip.legs.map((l) => ({ leg: l, g: gradeLeg(l, gameFor(l)) }));
    const n = legs.length;
    const hits = legs.filter((x) => x.g.state === 'hit').length;
    const misses = legs.filter((x) => x.g.state === 'miss').length;
    const dnps = legs.filter((x) => x.g.state === 'dnp' || x.g.state === 'void').length;
    const open = legs.filter((x) => x.g.state === 'live' || x.g.state === 'scheduled').length;
    const started = legs.some((x) => x.g.state !== 'scheduled');
    const entry = Number(slip.entry) || 0;
    const tiers = slip.payouts || null;
    const tierMult = (k) => (tiers && tiers[String(k)]) ? Number(tiers[String(k)]) : 0;
    const allWin = Number(slip.toWin) || (tiers ? entry * tierMult(n) : 0);

    // best still possible = everything open hits
    const bestCorrect = hits + open;
    let potential;
    if (tiers) potential = entry * tierMult(bestCorrect);
    else potential = misses === 0 ? allWin : 0;

    let state = 'open';
    let payout = null;
    if (open === 0 && started) {
      if (dnps > 0) { state = 'review'; }
      else {
        payout = tiers ? entry * tierMult(hits) : (misses === 0 ? allWin : 0);
        state = payout > 0 ? (hits === n ? 'won' : 'partial') : 'lost';
      }
    } else if (started) {
      state = potential > 0 ? 'live' : 'dead';
    }
    return { legs, n, hits, misses, dnps, open, potential, payout, state, entry };
  }

  /* First-TD bet: { name, team, stake, odds } in a game */
  function gradeFirstTD(bet, game) {
    const dec = americanToDecimal(bet.odds) || 0;
    const ret = (Number(bet.stake) || 0) * dec;
    if (!game || game.status.state === 'pre') return { state: 'scheduled', ret, scorer: null };
    const ftd = game.firstTD;
    if (!ftd) {
      if (game.status.state === 'post') return { state: 'miss', ret, scorer: null, note: 'No touchdown scored' };
      return { state: 'live', ret, scorer: null, note: 'No TD yet' };
    }
    const mine = ftd.scorerNorm && (ftd.scorerNorm === norm(bet.name) || norm(bet.name).startsWith(ftd.scorerNorm) || ftd.scorerNorm.startsWith(norm(bet.name)));
    return { state: mine ? 'hit' : 'miss', ret, scorer: ftd.scorer, note: `First TD: ${ftd.scorer}` };
  }

  /* 2+ TD scalp target: { name, team, stake, odds, cashedOut } */
  function gradeScalp(t, game) {
    const dec = americanToDecimal(t.odds) || 0;
    const full = (Number(t.stake) || 0) * dec;
    if (t.cashedOut !== undefined && t.cashedOut !== null && t.cashedOut !== '') {
      return { state: 'cashed', tds: null, realized: Number(t.cashedOut), full };
    }
    if (!game || game.status.state === 'pre') return { state: 'scheduled', tds: 0, full };
    const p = findPlayer(game, t);
    const tds = p ? p.stats.rushTD + p.stats.recTD : 0;
    if (tds >= 2) return { state: 'hit', tds, full, realized: full };
    if (game.status.state === 'post') return { state: 'miss', tds, full, realized: 0 };

function viewPick6() {

const Chat = {
  db: null, auth: null, uid: null, day: dayKey(), ref: null, msgs: [], open: false, unread: 0, lastSeen: store.get('pz_chat_seen', 0),
  async init() {

    $('#chatName').addEventListener('change', (e) => store.set('pz_chat_name', e.target.value.trim()));
    $('#chatForm').addEventListener('submit', (e) => { e.preventDefault(); this.send(); });
    $('#chatText').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(); } });
    const sel = $('#chatDay'); const days = []; for (let i = 0; i < 14; i++) { const d = new Date(); d.setDate(d.getDate() - i); days.push(dayKey(d)); }
    sel.innerHTML = days.map((d, i) => `<option value="${d}">${i === 0 ? 'Today' : new Date(d + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}</option>`).join('');
    sel.addEventListener('change', () => this.watch(sel.value));
    if (!FIREBASE || OVERLAY) { if (!FIREBASE) $('#chatList').innerHTML = '<div class="chat-off">Chat is being set up.</div>'; return; }
    try {
      await fbReady; this.auth = firebase.auth(); this.db = firebase.database();
      this.auth.onAuthStateChanged((u) => { this.uid = u ? u.uid : null; });
      this.watch(this.day);
      setInterval(() => { const d = dayKey(); if (d !== this.day && $('#chatDay').value === this.day) location.reload(); }, 60000);
    } catch (e) { $('#chatList').innerHTML = `<div class="chat-off">Chat could not load: ${esc(e.message)}</div>`; }
  },
  toggle(open) {
    this.open = open; $('#chat').hidden = !open; $('#chatFab').hidden = open; $('#chatFab').setAttribute('aria-expanded', String(open));
    if (open) { this.unread = 0; this.badge(); this.lastSeen = Date.now(); store.set('pz_chat_seen', this.lastSeen); setTimeout(() => { const l = $('#chatList'); l.scrollTop = l.scrollHeight; $('#chatText').focus(); }, 30); }
  },
  watch(day) {
    if (!this.db) return; if (this.ref) this.ref.off(); this.msgs = [];
    const isToday = day === dayKey(); $('#chatForm').hidden = !isToday;
    this.ref = this.db.ref('chat/' + day).orderByChild('ts').limitToLast(300);
    this.ref.on('value', (snap) => {
      const v = snap.val() || {}; this.msgs = Object.entries(v).map(([id, m]) => ({ id, ...m })).sort((a, b) => a.ts - b.ts);
      if (!this.open && isToday) { this.unread = this.msgs.filter((m) => m.ts > this.lastSeen && m.uid !== this.uid).length; this.badge(); }
      this.draw(isToday);

  },
  draw(isToday) {
    const l = $('#chatList'); const atBottom = l.scrollHeight - l.scrollTop - l.clientHeight < 60;
    l.innerHTML = this.msgs.length ? this.msgs.map((m) => `<div class="msg ${m.owner ? 'owner' : ''}"><div class="who">${esc(m.name)}${m.owner ? '<span class="vbadge">' + SVG.bolt.replace('<svg', '<svg width="9" height="9"') + ' POIZEN</span>' : ''}<time>${new Date(m.ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</time></div><div class="txt">${esc(m.text)}</div></div>`).join('') : `<div class="chat-off">${isToday ? 'No messages yet today. Drop a stat, an injury or a concern — it might change a pick.' : 'No messages that day.'}</div>`;
    if (atBottom || !this.open) l.scrollTop = l.scrollHeight;
  },
  badge() { const b = $('#chatBadge'); b.hidden = !this.unread; b.textContent = this.unread > 99 ? '99+' : this.unread; },
  async send() {
    const ta = $('#chatText'); const text = ta.value.trim(); const note = $('#chatNote'); if (!text) return;
    if (!this.db) { note.textContent = 'Chat is still connecting.'; return; }
    const name = ($('#chatName').value.trim() || 'Anonymous').slice(0, 24); store.set('pz_chat_name', $('#chatName').value.trim());
    $('#chatSend').disabled = true;
    try {
      if (!this.auth.currentUser) await this.auth.signInAnonymously();
      const uid = this.auth.currentUser.uid, day = dayKey(), key = this.db.ref('chat/' + day).push().key, T = firebase.database.ServerValue.TIMESTAMP;
      await this.db.ref().update({ [`chat/${day}/${key}`]: { uid, name, text: text.slice(0, 400), ts: T }, [`rate/${uid}`]: T });
      ta.value = ''; note.textContent = 'Each day gets a fresh room. Past days stay in the archive.';
    } catch (e) { note.textContent = /permission/i.test(e.message) ? 'One message every 3 seconds — try again in a moment.' : 'Could not send: ' + e.message; }
    finally { $('#chatSend').disabled = false; }
  },
};


/* ---------------- boot ---------------- */
(async function boot() {
  S.G = gradeAll(); render();
  await refreshFiles(); poll();
  setInterval(refreshFiles, 120000);
  watchBoard(); Chat.init(); watchPickem();
  if (params.has('demo')) DEMO.forEach((m) => Moments.push(m));
  loadInjuries().then(() => { S.projMemo = {}; render(); }); loadLogs();
  if (S.tab === 'injuries' || S.tab === 'research') loadInjuries();
  if (S.tab === 'research') loadResearch();
  if (['ledger', 'pick6', 'ftd', 'scalp'].includes(S.tab)) loadArchive();
})();
</script>
