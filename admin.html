<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Poizen Lounge · Owner Console</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Owner console — same house as the board: black glass, venom teal, crest gold.
   One job per section; the left rail is the order you work a week in. */
:root{
  --bg:#04070A;--panel:#0F151D;--panel2:#151D27;--panel3:#1B2532;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --fg:#F4F7FA;--fg2:#9FB0C0;--fg3:#647585;--teal:#14F1C7;--teal2:#0FB89A;--gold:#F2C14E;--gold2:#FFDF8A;--gold-d:#8A6414;
  --win:#2EE59D;--loss:#FF3B5C;--live:#FFC53D;--sky:#4CC9F0;--violet:#9B7BFF;--pink:#F472B6;
  --card-grad:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  --stadium:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--jersey:'Teko','Barlow Condensed',sans-serif;--body:'Plus Jakarta Sans',system-ui,sans-serif;
  --shadow:0 24px 50px -22px rgba(0,0,0,.9);--acc:var(--teal);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--fg);font:14px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1000px 600px at 6% -10%,rgba(242,193,78,.12),transparent 62%),radial-gradient(900px 560px at 96% 0%,rgba(20,241,199,.12),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--sky)}
.st{font-family:var(--stadium);text-transform:uppercase;letter-spacing:.02em}
.muted{color:var(--fg2)} .dim{color:var(--fg3)} .gold{color:var(--gold)} .win{color:var(--win)} .loss{color:var(--loss)}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-in{max-width:460px;text-align:center}
.gate img{width:190px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.8)) drop-shadow(0 0 30px rgba(242,193,78,.25))}
.gate h1{margin:14px 0 6px;font:900 44px/.95 var(--stadium);text-transform:uppercase;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.gate p{color:var(--fg2)}

/* top */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:54px;height:54px;object-fit:contain;border-radius:50%;background:radial-gradient(circle,rgba(242,193,78,.28),rgba(242,193,78,.06) 55%,transparent 72%)}
.brand b{display:block;font:900 24px/.9 var(--stadium);text-transform:uppercase;letter-spacing:.04em;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand span{display:block;font-size:11px;font-weight:800;color:var(--fg2);margin-top:3px;white-space:nowrap}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.state{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:12px;font-weight:800;white-space:nowrap}
.state i{width:8px;height:8px;border-radius:50%;background:var(--win)}
.state.dirty{border-color:rgba(242,193,78,.6);color:var(--gold)} .state.dirty i{background:var(--gold);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border-radius:13px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);font-weight:800;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--fg3)}
.btn svg{width:16px;height:16px}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#C38F1C);border-color:var(--gold);color:#1C1302;box-shadow:0 10px 26px -12px var(--gold)}
.btn.teal{background:linear-gradient(135deg,var(--teal),var(--teal2));border-color:var(--teal);color:#02130F}
.btn.warn{color:#FFB3C1;border-color:rgba(255,59,92,.45)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;padding:18px 18px 120px;align-items:start}
.rail{position:sticky;top:92px;display:flex;flex-direction:column;gap:5px;padding:10px;border-radius:22px;background:var(--card-grad),var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.nav{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;border:1px solid transparent;background:transparent;color:var(--fg2);font-weight:800;text-align:left}
.nav:hover{background:var(--panel2);color:var(--fg)}
.nav svg{width:18px;height:18px;flex:none}
.nav .n{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(127,127,127,.18)}
.nav .n.hot{background:var(--gold);color:#1C1302}
.nav[aria-current="page"]{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#000));color:#06080b;box-shadow:0 12px 26px -12px var(--acc)}
.rail-foot{margin-top:6px;padding:10px 12px;border-radius:13px;background:var(--panel2);font-size:12px;color:var(--fg2)}
main{min-width:0}
body[data-sec="overview"]{--acc:#F2C14E} body[data-sec="slips"]{--acc:#8B6CFF} body[data-sec="bets"]{--acc:#22D3EE} body[data-sec="pickem"]{--acc:#F472B6}
body[data-sec="results"]{--acc:#7CF27C} body[data-sec="stream"]{--acc:#FF3B5C} body[data-sec="chat"]{--acc:#4CC9F0} body[data-sec="settings"]{--acc:#9FB0C0}

/* banner */
.banner{position:relative;overflow:hidden;border-radius:24px;padding:22px 24px;margin-bottom:18px;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);background:radial-gradient(900px 260px at 0 0,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%),linear-gradient(120deg,color-mix(in srgb,var(--acc) 14%,var(--panel)),var(--panel) 70%);box-shadow:var(--shadow);isolation:isolate}
.banner .wm{position:absolute;right:-18px;top:50%;transform:translateY(-50%) rotate(-8deg);width:200px;height:200px;color:var(--acc);opacity:.13;z-index:-1}
.banner .wm svg{width:100%;height:100%}
.banner h2{margin:0;font:900 44px/.92 var(--stadium);text-transform:uppercase}
.banner h2 span{color:var(--acc)}
.banner p{margin:8px 0 0;color:var(--fg2);max-width:72ch}
.sec{margin:26px 0 12px;font:900 22px/1 var(--stadium);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

.card{position:relative;background:var(--card-grad),var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:16px;align-items:start}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--line2);background:rgba(127,127,127,.08);white-space:nowrap}
.chip.win{color:var(--win);border-color:color-mix(in srgb,var(--win) 40%,transparent)} .chip.loss{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
.chip.gold{color:var(--gold);border-color:rgba(242,193,78,.45)} .chip.live{background:var(--loss);border-color:var(--loss);color:#fff}
input,select,textarea{padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:#0A1016;color:var(--fg);font:inherit;min-width:0}
textarea{width:100%;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;color:var(--fg2)}
.empty{padding:26px;text-align:center;color:var(--fg2);border:1px dashed var(--line2);border-radius:18px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card-grad),var(--panel);box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .k{font-size:11px;font-weight:800;color:var(--fg2)} .tile .v{font:900 34px/1 var(--stadium);margin-top:8px;white-space:nowrap} .tile .s{font-size:12px;color:var(--fg2);margin-top:4px}
.tile.g .v{color:var(--gold)} .tile.t .v{color:var(--teal)} .tile.p .v{color:var(--pink)}

/* checklist */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel2)}
.step .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);font:900 15px var(--stadium)}
.step.done .ic{background:var(--win);border-color:var(--win);color:#032015}
.step.now{border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:linear-gradient(90deg,rgba(242,193,78,.12),var(--panel2))}
.step.now .ic{border-color:var(--gold);color:var(--gold)}
.step b{display:block} .step span{font-size:12px;color:var(--fg2)}
.step svg{width:16px;height:16px}

/* tickets */
.tk{padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.tk::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--acc),var(--gold))}
.tk.unconf{border-style:dashed}
.tk-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.tk-h h3{margin:0;font:900 26px/1 var(--stadium);text-transform:uppercase}
.tk-h .meta{font-size:12px;font-weight:700;color:var(--fg2);margin-top:4px}
.legs{display:flex;flex-direction:column;gap:5px}
.leg{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px 6px 6px;border-radius:13px;background:rgba(127,127,127,.06)}
.av{width:40px;height:40px;border-radius:11px;overflow:hidden;position:relative;background:var(--tg,#1f2937)}
.av img{position:absolute;left:50%;top:2px;transform:translateX(-50%);height:46px;width:auto;max-width:none}
.leg b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg span{display:block;font-size:11px;color:var(--fg2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip{font:900 17px/1 var(--stadium);padding:5px 9px;border-radius:10px;background:var(--panel3);min-width:54px;text-align:center}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.grade>div{padding:9px 11px;border-radius:13px;background:var(--panel2);border:1px solid var(--line)}
.grade .k{font-size:10px;font-weight:800;color:var(--fg3)} .grade .v{font:900 22px/1.1 var(--stadium)}
.verdict{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font:900 15px/1 var(--stadium)}
.verdict.good{background:var(--win);color:#032015} .verdict.bad{background:var(--loss);color:#fff} .verdict.na{background:var(--panel3);color:var(--fg2)}
.flags{display:flex;flex-wrap:wrap;gap:5px}

/* list rows */
.lr{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:13px;background:rgba(127,127,127,.05)}
.lr+.lr{margin-top:6px}
.lr b{display:block;font-weight:800} .lr span{font-size:12px;color:var(--fg2)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--fg3);font-weight:900;padding:8px 10px}
td{padding:10px;border-top:1px solid var(--line)}
td.n{text-align:right;font-weight:800}
.scroll{overflow-x:auto}

/* stream */
.fire{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fire button{padding:16px 12px;border-radius:16px;border:1px solid var(--line2);background:var(--panel2);text-align:left}
.fire button b{display:block;font:900 22px/1 var(--stadium);text-transform:uppercase}
.fire button span{font-size:11px;font-weight:700;color:var(--fg2)}
.fire button:hover{border-color:var(--acc)}
.urlrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

.msg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 4px;border-top:1px solid var(--line)}
.msg:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;padding:12px 18px;border-radius:14px;background:#0B1118;border:1px solid var(--line2);font-weight:800;box-shadow:0 20px 40px -10px #000;max-width:calc(100vw - 32px)}
.toast.ok{border-color:var(--win)} .toast.bad{border-color:var(--loss)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:110px}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:45;flex-direction:row;overflow-x:auto;border-radius:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(18px)}
  .rail .nav{flex-direction:column;gap:3px;font-size:11px;padding:8px 10px;min-width:70px}
  .rail .nav .n,.rail-foot{display:none}
  .brand span,.top-r .hide-sm{display:none}
  .banner h2{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-sec="overview">
<div class="gate" id="gate">
  <div class="gate-in">
    <img src="crest.png" alt="Maciel's Incorporated crest">
    <h1>Owner Console</h1>
    <p>Sign in with the owner Google account. Any other account can open this page but cannot change anything — the database refuses the write.</p>
    <button class="btn gold" id="signin" type="button" style="padding:13px 22px;font-size:15px">Sign in with Google</button>
    <p class="dim" id="gateMsg" style="font-size:12px"></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top"><div class="top-in">
    <div class="brand"><img src="crest.png" alt=""><div><b>Poizen Lounge</b><span id="weekName">Owner console</span></div></div>
    <div class="top-r">
      <span class="state" id="state"><i></i><span>Up to date</span></span>
      <a class="btn ghost hide-sm" href="./" target="_blank" rel="noopener">Open board</a>
      <button class="btn gold" id="publish" type="button">Publish</button>
      <button class="btn ghost sm hide-sm" id="signout" type="button">Sign out</button>
    </div>
  </div></header>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Console sections"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>/* Poizen Lounge — grading engine (pure functions, no DOM).
   Works in the browser (window.PZE) and in Node (module.exports) for tests.
   Data source: ESPN public site API (scoreboard + game summary). */
(function (root) {
  'use strict';

  const ESPN = {
    scoreboard: (sport) => `https://site.api.espn.com/apis/site/v2/sports/${sportPath(sport)}/scoreboard`,
    summary: (sport, id) => `https://site.api.espn.com/apis/site/v2/sports/${sportPath(sport)}/summary?event=${id}`,
    gamelog: (id) => `https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/${id}/gamelog`,
    injuries: () => 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries',
    search: (q) => `https://site.web.api.espn.com/apis/common/v3/search?query=${encodeURIComponent(q)}&type=player&limit=6`,
  };
  function sportPath(s) { return s === 'mlb' ? 'baseball/mlb' : 'football/nfl'; }

  // ---------- names ----------
  function norm(name) {
    return String(name || '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/[.'’`]/g, '')
      .replace(/-/g, ' ')
      .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, ' ')
      .replace(/[^a-z ]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // ---------- odds ----------
  function americanToDecimal(odds) {
    const n = Number(String(odds).replace('+', ''));
    if (!isFinite(n) || n === 0) return null;
    return n > 0 ? 1 + n / 100 : 1 + 100 / Math.abs(n);
  }

  // ---------- number parsing ----------
  function num(v) {
    if (v === undefined || v === null || v === '' || v === '-' || v === '--') return 0;
    const n = Number(v);
    return isFinite(n) ? n : 0;
  }
  function ipToOuts(ip) { // "5.2" -> 17 outs
    const [w, p] = String(ip || '0').split('.');
    return num(w) * 3 + num(p);
  }

  // ---------- summary parsing ----------
  function gameStatus(summary) {
    const comp = summary && summary.header && summary.header.competitions && summary.header.competitions[0];
    const st = (comp && comp.status) || {};
    const t = st.type || {};
    return {
      state: t.state || 'pre',               // pre | in | post
      name: t.name || '',
      completed: !!t.completed,
      detail: t.shortDetail || t.detail || '',
      period: st.period || 0,
      clock: st.displayClock || '',
      postponed: /POSTPONED|CANCELED|CANCELLED|SUSPENDED/.test(t.name || ''),
    };
  }

  function emptyStats() {
    return {
      passYds: 0, passTD: 0, passAtt: 0, completions: 0, ints: 0,
      rushYds: 0, rushTD: 0, rushAtt: 0,
      rec: 0, recYds: 0, recTD: 0, targets: 0,
      // mlb batting
      h: 0, r: 0, rbi: 0, hr: 0, bb: 0, k: 0, ab: 0,
      // mlb pitching
      pK: 0, pOuts: 0, pER: 0, pH: 0,
    };
  }

  function parseBox(summary, sport) {
    const players = {}; // key: espn id
    const byName = {};  // norm name -> id
    const teams = (summary && summary.boxscore && summary.boxscore.players) || [];
    for (const t of teams) {
      const team = t.team && t.team.abbreviation;
      for (const cat of t.statistics || []) {
        const keys = cat.keys || [];
        const kind = cat.name || cat.type;
        for (const a of cat.athletes || []) {
          const id = String(a.athlete && a.athlete.id);
          const name = a.athlete && a.athlete.displayName;
          if (!players[id]) players[id] = { id, name, team, stats: emptyStats(), cats: [] };
          const p = players[id];
          p.cats.push(kind);
          byName[norm(name)] = id;
          const v = {};
          keys.forEach((k, i) => { v[k] = (a.stats || [])[i]; });
          const s = p.stats;
          if (sport === 'mlb') {
            if (kind === 'batting') {
              s.h += num(v.hits); s.r += num(v.runs); s.rbi += num(v.RBIs); s.hr += num(v.homeRuns);
              s.bb += num(v.walks); s.k += num(v.strikeouts); s.ab += num(v.atBats);
            } else if (kind === 'pitching') {
              s.pK += num(v.strikeouts); s.pER += num(v.earnedRuns); s.pH += num(v.hits);
              s.pOuts += ipToOuts(v['fullInnings.partInnings']);
            }
          } else {
            if (kind === 'passing') {
              const ca = String(v['completions/passingAttempts'] || '0/0').split('/');
              s.completions += num(ca[0]); s.passAtt += num(ca[1]);
              s.passYds += num(v.passingYards); s.passTD += num(v.passingTouchdowns); s.ints += num(v.interceptions);
            } else if (kind === 'rushing') {
              s.rushAtt += num(v.rushingAttempts); s.rushYds += num(v.rushingYards); s.rushTD += num(v.rushingTouchdowns);
            } else if (kind === 'receiving') {
              s.rec += num(v.receptions); s.recYds += num(v.receivingYards); s.recTD += num(v.receivingTouchdowns);
              s.targets += num(v.receivingTargets);
            }
          }
        }
      }
    }
    return { players, byName };
  }

  // Scorer of a touchdown play, from ESPN text like
  // "J.K. Dobbins 4 Yd Rush (Wil Lutz Kick)" or "Rashid Shaheed 42 Yd pass from Sam Darnold (...)"
  function tdScorerFromText(text) {
    const m = String(text || '').match(/^(.+?)\s+-?\d+\s+(Yd|Yard|Yds)/i);
    if (m) return m[1].trim();
    const m2 = String(text || '').match(/^([^\d(]+?)\s+\d/);
    return m2 ? m2[1].trim() : null;

  function scoringPlays(summary) {
    return ((summary && summary.scoringPlays) || []).map((p) => {
      const isTD = ((p.scoringType && p.scoringType.abbreviation) || (p.type && p.type.abbreviation)) === 'TD';
      const scorer = isTD ? tdScorerFromText(p.text) : null;

  function parseGame(summary, sport) {
    const status = gameStatus(summary);
    const box = parseBox(summary, sport);
    const plays = sport === 'nfl' ? scoringPlays(summary) : [];
    const firstTD = plays.find((p) => p.isTD) || null;
    const comp = summary && summary.header && summary.header.competitions && summary.header.competitions[0];
    const score = {};
    for (const c of (comp && comp.competitors) || []) score[c.team && c.team.abbreviation] = num(c.score);

  // ---------- markets ----------
  const MARKETS = {
    // NFL
    pass_yds: { sport: 'nfl', label: 'Passing Yards', short: 'Pass Yds', f: (s) => s.passYds },
    pass_td: { sport: 'nfl', label: 'Passing TDs', short: 'Pass TD', f: (s) => s.passTD },

    rec_yds: { sport: 'nfl', label: 'Receiving Yards', short: 'Rec Yds', f: (s) => s.recYds },
    receptions: { sport: 'nfl', label: 'Receptions', short: 'Rec', f: (s) => s.rec },
    rush_rec_yds: { sport: 'nfl', label: 'Rush + Rec Yards', short: 'Rush+Rec Yds', f: (s) => s.rushYds + s.recYds },

    pitcher_ks: { sport: 'mlb', label: 'Pitcher Strikeouts', short: 'Ks', f: (s) => s.pK },

  function gradeFirstTD(bet, game) {

  }

    const names = j.names || [];

<script>/* Poizen Lounge — probability model.

(function (root) {

  const COUNT_MARKETS = new Set(['receptions', 'completions', 'pass_att', 'rush_att', 'interceptions', 'hits', 'runs', 'rbis', 'hrr', 'batter_ks', 'pitcher_ks', 'pitcher_outs']);

/* ---------- validation (also used for AI imports) ---------- */
function validateSlate(s) {
  const errs = []; if (!s || typeof s !== 'object') return ['Not a JSON object'];
  const players = s.players || {}; const need = (k, where) => { if (!players[k]) errs.push(`${where}: player "${k}" is missing from "players"`); };
  for (const t of s.pick6 || []) { if (!t.id) errs.push(`Slip "${t.title || '?'}" needs an id`); if (!(Number(t.entry) > 0)) errs.push(`Slip "${t.title || t.id}" needs an entry amount`); for (const l of t.legs || []) { need(l.player, `Slip "${t.title || t.id}"`); if (!E.MARKETS[l.market]) errs.push(`Slip "${t.title || t.id}": unknown market "${l.market}"`); if (!isFinite(Number(l.line))) errs.push(`Slip "${t.title || t.id}": bad line for ${l.player}`); } }
  for (const b of (s.firstTD && s.firstTD.bets) || []) { need(b.player, 'First TD'); if (!E.americanToDecimal(b.odds)) errs.push(`First TD ${b.player}: bad odds "${b.odds}"`); }
  for (const sh of (s.scalp && s.scalp.shifts) || []) for (const t of sh.targets || []) { need(t.player, 'Scalp'); if (!E.americanToDecimal(t.odds)) errs.push(`Scalp ${t.player}: bad odds "${t.odds}"`); }
  for (const [k, p] of Object.entries(players)) { if (!p.name || !p.team) errs.push(`Player "${k}" needs name and team`); if (p.sport && !['nfl', 'mlb'].includes(p.sport)) errs.push(`Player "${k}": sport must be nfl or mlb`); }
  return errs;
}

/* ---------- ESPN data for the Lab, grading and Pick'em locks ---------- */
async function loadESPN() {
  const sports = [...new Set(Object.values(A.slate.players || {}).map((p) => p.sport || 'nfl'))]; if (!sports.includes('nfl')) sports.push('nfl');

        const info = { id: ev.id, sport: sp, date: ev.date, name: ev.shortName, state: st.state || 'pre', detail: st.shortDetail || '', period: ev.status && ev.status.period, clock: ev.status && ev.status.displayClock, indoor: c.venue && c.venue.indoor, weather: ev.weather && ev.weather.displayValue,
          comps: (c.competitors || []).map((t) => ({ ha: t.homeAway, abbr: t.team.abbreviation })), odds: odds ? { total: odds.overUnder, spread: odds.spread, fav: odds.homeTeamOdds && odds.homeTeamOdds.favorite ? 'home' : odds.awayTeamOdds && odds.awayTeamOdds.favorite ? 'away' : null } : null };
        A.events[ev.id] = info; info.comps.forEach((t) => { const k = sp + ':' + t.abbr; const prev = A.events[A.teamEvent[k]]; if (!prev || (prev.state === 'post' && info.state !== 'post') || (prev.state === info.state && info.date < prev.date)) A.teamEvent[k] = ev.id; }); }
    } catch {}
  }

  const ids = [...new Set(Object.values(A.slate.players || {}).filter((p) => p.espnId && (p.sport || 'nfl') === 'nfl').map((p) => p.espnId))].filter((id) => !A.logs[id]);
  await Promise.all(ids.map(async (id) => { try { A.logs[id] = E.gamelogRows(await getJSON(E.ESPN.gamelog(id))); } catch { A.logs[id] = null; } }));
  A.memo = {}; render();
}
const eventFor = (k) => { const p = P(k); return A.events[A.teamEvent[(p.sport || 'nfl') + ':' + p.team]] || null; };
function impliedFor(ev, abbr) { if (!ev || !ev.odds || !ev.odds.fav || !isFinite(Number(ev.odds.total)) || !isFinite(Number(ev.odds.spread))) return null; const tot = Number(ev.odds.total), sp = Math.abs(Number(ev.odds.spread)); const me = ev.comps.find((t) => t.abbr === abbr); return me && me.ha === ev.odds.fav ? (tot + sp) / 2 : (tot - sp) / 2; }
function leagueImplied() { const xs = []; Object.values(A.events).forEach((ev) => { if (ev.sport !== 'nfl') return; ev.comps.forEach((t) => { const v = impliedFor(ev, t.abbr); if (v) xs.push(v); }); }); return xs.length >= 6 ? xs.reduce((a, b) => a + b, 0) / xs.length : 22.5; }
const TEAMNAMES = { 'Arizona Cardinals': 'ARI', 'Atlanta Falcons': 'ATL', 'Baltimore Ravens': 'BAL', 'Buffalo Bills': 'BUF', 'Carolina Panthers': 'CAR', 'Chicago Bears': 'CHI', 'Cincinnati Bengals': 'CIN', 'Cleveland Browns': 'CLE', 'Dallas Cowboys': 'DAL', 'Denver Broncos': 'DEN', 'Detroit Lions': 'DET', 'Green Bay Packers': 'GB', 'Houston Texans': 'HOU', 'Indianapolis Colts': 'IND', 'Jacksonville Jaguars': 'JAX', 'Kansas City Chiefs': 'KC', 'Las Vegas Raiders': 'LV', 'Los Angeles Chargers': 'LAC', 'Los Angeles Rams': 'LAR', 'Miami Dolphins': 'MIA', 'Minnesota Vikings': 'MIN', 'New England Patriots': 'NE', 'New Orleans Saints': 'NO', 'New York Giants': 'NYG', 'New York Jets': 'NYJ', 'Philadelphia Eagles': 'PHI', 'Pittsburgh Steelers': 'PIT', 'San Francisco 49ers': 'SF', 'Seattle Seahawks': 'SEA', 'Tampa Bay Buccaneers': 'TB', 'Tennessee Titans': 'TEN', 'Washington Commanders': 'WSH' };
const injFor = (abbr) => { const t = (A.injuries || []).find((x) => TEAMNAMES[x.displayName] === abbr); return t ? t.injuries || [] : []; };
const POSGROUP = { WR: 'rec', TE: 'rec', RB: 'run', FB: 'run', QB: 'qb' };
const DEF = /^(CB|S|FS|SS|LB|ILB|OLB|MLB|DE|DT|NT|DL|EDGE|DB)$/;
function legPre(leg) {
  const key = leg.player + '|' + leg.market + '|' + leg.line + '|' + (leg.dir || 'over'); if (A.memo[key]) return A.memo[key];

  else if ((p.sport || 'nfl') === 'nfl' && rows && rows.length) {

async function syncLocks(silent) {
  const wk = weekKeyOf(A.slate.title); const now = Date.now(); const upd = {}; let opened = 0;
  pickemLegs().forEach((x) => { const ev = eventFor(x.leg.player); if (!ev) return; const ko = new Date(ev.date).getTime(); const cur = A.locks[x.id];
    if (cur && cur <= now) return; // never reopen a locked leg
    if (ev.state === 'pre' && ko > now && cur !== ko) { upd[x.id] = ko; opened++; } });
  if (!opened) { if (!silent) toast('Pick’em is already up to date'); return 0; }
  try { await db.ref('pickemLocks/' + wk).update(upd); if (!silent) toast(`Opened ${opened} leg${opened > 1 ? 's' : ''} for Pick’em`); }
  catch (e) { toast('Could not open Pick’em: ' + e.message, 'bad', 6000); }
  return opened;
}

  (A.slate.pick6 || []).forEach((tk) => tk.legs.forEach((l) => { const ev = eventFor(l.player); if (ev && ev.state !== 'pre') return; const pre = legPre(l); if (pre && pre.source === 'log') l.prob = Math.round(pre.p * 1000) / 1000; }));

  if (t.id === 'crownChamp') return crown();
  if (t.dataset.kick) return armed(t, 'Tap again', async () => { try { await db.ref(`pickem/${weekKeyOf(A.slate.title)}/players/${t.dataset.kick}`).remove(); toast('Removed from Pick’em'); } catch (er) { toast('Could not remove: ' + er.message, 'bad'); } });
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); toast('Copied'); } catch { toast('Copy blocked — select the box and copy', 'bad'); } return; }
  if (t.dataset.fire) { const [type, word, sub] = t.dataset.fire.split('|'); return fire(type, word, sub); }
  if (t.id === 'fireCustom') { const w = $('#fWord').value.trim(); if (!w) { toast('Type the big word first', 'bad'); return; } return fire('hype', w, $('#fSub').value.trim()); }
  if (t.id === 'archive') return armed(t, 'Tap again to archive', archiveWeek);
  if (t.id === 'rawApply') { try { const j = JSON.parse($('#raw').value); const errs = validateSlate(j); if (errs.length) { $('#rawMsg').textContent = errs[0]; return; } A.slate = fixArrays(j); A.memo = {}; setDirty(); render(); toast('Applied — publish to send it live'); } catch (er) { $('#rawMsg').textContent = 'Invalid JSON: ' + er.message; } return; }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.cash) { const [i, j] = el.dataset.cash.split(':').map(Number); const tg2 = A.slate.scalp.shifts[i].targets[j]; if (el.value === '') delete tg2.cashedOut; else tg2.cashedOut = Number(el.value); setDirty(); }
  if (el.dataset.share !== undefined) { const tk = A.slate.pick6[Number(el.dataset.share)]; const v = el.value.trim(); if (v) tk.shareUrl = v; else delete tk.shareUrl; setDirty(); }
  if (el.id === 'title') { A.slate.title = el.value.trim() || A.slate.title; setDirty(); $('#weekName').textContent = A.slate.title + ' · owner console'; }
  if (el.id === 'dkLink') { A.slate.dkLink = el.value.trim(); setDirty(); }
});
async function fire(type, word, sub) { try { await db.ref('board/moment').set({ type, word, sub: sub || '', at: Date.now() }); toast(`Fired “${word}” on every board and overlay`); } catch (e) { toast('Could not fire: ' + e.message, 'bad'); } }
async function ownerPost() {
  const text = $('#ownerMsg').value.trim(); if (!text) return;
  const uid = auth.currentUser.uid, day = dayKey(), key = db.ref('chat/' + day).push().key, T = firebase.database.ServerValue.TIMESTAMP;
  try { await db.ref().update({ [`chat/${day}/${key}`]: { uid, name: 'PoiZen', text: text.slice(0, 400), ts: T, owner: true }, [`rate/${uid}`]: T }); $('#ownerMsg').value = ''; } catch (e) { toast('Could not post: ' + e.message, 'bad'); }
}
async function crown() {
  const lb = pickemRows(); if (!lb.length) return; const top = lb[0]; const wk = weekKeyOf(A.slate.title);
  try { await db.ref('pickemChamps/' + wk).set({ uid: top.uid, name: top.name, points: top.pts, of: top.of, title: A.slate.title, at: new Date().toISOString() }); toast(`${top.name} crowned for ${A.slate.title}`); await fire('leader', 'Champion', `${top.name} · ${top.pts} correct`); } catch (e) { toast('Could not crown: ' + e.message, 'bad'); }
}
async function archiveWeek() {
  const key = weekKeyOf(A.slate.title) + '-' + dayKey();
  try { await db.ref('board/archive/' + key).set({ title: A.slate.title, closedAt: new Date().toISOString(), slate: JSON.parse(JSON.stringify(A.slate)) }); toast('Archived — it shows under Previous weeks'); if (pickemRows().length) await crown(); }
  catch (e) { toast('Archive failed: ' + e.message, 'bad'); }
}
window.addEventListener('beforeunload', (e) => { if (A.dirty) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => { A.sec = location.hash.slice(1); render(); });

/* ---------- boot ---------- */
(async function boot() {
  try { await loadScripts(['https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js', 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js', 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js']); firebase.initializeApp(FIREBASE); auth = firebase.auth(); db = firebase.database(); }
  catch (e) { $('#gateMsg').textContent = 'Could not load sign-in: ' + e.message; return; }
  $('#signin').onclick = async () => { try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch (e) { if (/popup/i.test(e.code || '')) await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); else $('#gateMsg').textContent = e.message; } };
  auth.onAuthStateChanged(async (u) => {
    const owner = u && u.email === OWNER_EMAIL && u.emailVerified;
    $('#gate').hidden = !!owner; $('#app').hidden = !owner;
    if (u && !owner) { $('#gateMsg').textContent = `${u.email || 'This account'} is not the owner account. Nothing can be changed from it.`; return; }
    if (!owner) return;
    const s = (await db.ref('board/slate').get()).val();
    A.slate = fixArrays(s && s.players ? s : JSON.parse(JSON.stringify(SEED)));
    A.results = (await db.ref('board/results').get()).val() || { entries: {} };
    setDirty(!(s && s.players)); render(); if (!(s && s.players)) toast('Board not published yet — check the slips, then Publish', 'ok', 5000);
    const wk = weekKeyOf(A.slate.title);
    db.ref('pickem/' + wk + '/players').on('value', (snap) => { A.pickem = snap.val() || {}; if (['pickem', 'overview'].includes(A.sec)) render(); else $('#rail').innerHTML = navHTML(); }, () => {});
    db.ref('pickemLocks/' + wk).on('value', (snap) => { A.locks = snap.val() || {}; if (['pickem', 'overview'].includes(A.sec)) render(); }, () => {});
    db.ref('chat/' + dayKey()).orderByChild('ts').limitToLast(150).on('value', (snap) => { A.chat = Object.entries(snap.val() || {}).map(([id, m]) => ({ id, ...m })).sort((a, b) => b.ts - a.ts); if (['chat', 'overview'].includes(A.sec)) render(); else $('#rail').innerHTML = navHTML(); }, () => {});
    loadESPN();
  });
})();

/* test hook: ?preview renders the console with the seed slate and no sign-in (no writes possible) */
if (new URLSearchParams(location.search).has('preview') && /^(file:|http:\/\/localhost)/.test(location.href)) { A.slate = fixArrays(JSON.parse(JSON.stringify(SEED))); $('#gate').hidden = true; $('#app').hidden = false; render(); loadESPN(); }
</script>
</body>
